# DevShield signal weights
# Documented in docs/BRIEF.md § 6 and analyzer/signals.py
#
# Tiered signals use sub-keys; main.py reads the sub-key weights directly
# from the check functions (which return the correct weight), not from here.
# This file is the authoritative human-readable record of all weights.
#
# magic_mismatch:
#   executable_header_nonexec_ext: 70  (PE/ELF under image/doc/source extension)
#   other: 35
# install_script:
#   download_exec: 75  (curl|sh, wget|bash, Invoke-Expression, iex)
#   other: 35
# double_extension:
#   dangerous_exec_ext: 45  (.exe .scr .bat .cmd .ps1 .vbs — classic attack exts)
#   other_exec_ext: 25
# obfuscated_code:
#   eval_decode: 40  (eval(atob, eval(base64, exec(base64))
#   large_blob: 25

known_bad_hash: 100
magic_mismatch: 70
install_script: 75
double_extension: 45
non_registry_dependency: 35
binary_in_source_dir: 30
obfuscated_code: 40
hidden_file_unusual_location: 10
# hardcoded_secret: 45-80 (AWS key=80, private key=75, generic pattern=45)
hardcoded_secret: 75
# xss_injection_risk: 25-75 (eval(user_input)=75, dangerouslySetInnerHTML=60)
xss_injection_risk: 60
# sql_injection_risk: 30-70 (raw exec with user params=70, string concat=50)
sql_injection_risk: 60
# suspicious_network_call: 35-90 (reverse shell=90, DNS tunnel=80, raw TCP=60)
suspicious_network_call: 80
